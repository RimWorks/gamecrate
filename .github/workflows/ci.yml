name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v3

  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      # rimworld typechecks against @gamecrate/cli's emitted declarations, and dist is ignored
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Docs are generated from the source
        run: bun run docs:check

      # TODO(bun#37968): drop this step when oven-sh/bun#38008 ships
      - name: One worker per test file
        run: |
          files=$(ls packages/*/test/*.test.ts | wc -l)
          grep -Fq -- '--parallel=$(ls packages/*/test/*.test.ts | wc -l)' package.json \
            || { echo "the test script must give each of the $files test files its own worker"; exit 1; }

      - name: Test
        timeout-minutes: 10
        run: bun run test
