name: images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime-base
            file: runtime-base.Dockerfile
          - name: runtime-base-proton
            file: runtime-base-proton.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # a registry refuses an uppercase path component, and the repo owner is RimWorks
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      # both Dockerfiles COPY scripts/headless-common.sh, a path relative to the images context
      # :1 is what base.ts names, so an apt fix reaches a released cli. A change that breaks
      # an older gamecrate gets :2 and a base.ts commit, never a silent :1 push.
      - name: Build
        run: docker build -t "$IMAGE:1" -t "$IMAGE:latest" -f "images/${{ matrix.file }}" images

      - name: Push
        run: |
          docker push "$IMAGE:1"
          docker push "$IMAGE:latest"

      - name: Report digest
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest")
          echo "::notice title=${{ matrix.name }}::$digest"
          echo "${{ matrix.name }}: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
