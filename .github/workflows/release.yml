name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      npm_config_workspaces_update: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # rimworld's prepare typechecks against the cli's emitted declarations, so the tooling
      # install below cannot be the thing that first runs it
      - name: Build
        run: bun run build

      - name: Install release tooling with npm, the only thing that lays out npm itself
        run: |
          npm install --no-save --ignore-scripts --no-package-lock \
            semantic-release@25.0.9 \
            @discordservers/semantic-release-monorepo@9.0.1

      - name: Release @gamecrate/cli
        working-directory: packages/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release

      - name: Release @gamecrate/rimworld
        working-directory: packages/rimworld
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
