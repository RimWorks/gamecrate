name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci --ignore-scripts

      # rimworld's prepare typechecks against the cli's emitted declarations, so the tooling
      # install below cannot be the thing that first runs it
      - name: Build
        run: npm run build

      - name: Install release tooling
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set @discordservers:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$GITHUB_PACKAGES_TOKEN"
          npm install --no-save \
            semantic-release@25.0.9 \
            @discordservers/semantic-release-monorepo@1.0.0

      - name: Release @gamecrate/cli
        working-directory: packages/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release

      - name: Release @gamecrate/rimworld
        working-directory: packages/rimworld
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
