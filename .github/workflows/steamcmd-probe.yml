name: steamcmd-probe

on:
  push:
    branches: [probe/steamcmd-bootstrap]

permissions:
  contents: read

jobs:
  real:
    runs-on: ubuntu-latest
    steps:
      - name: Install the published cli the way the image action does
        run: |
          npm install -g --no-fund --no-audit @gamecrate/cli
          npm install --no-fund --no-audit --no-save @gamecrate/rimworld
          gamecrate version

      - name: Run the real steam build with a stub session, no push
        continue-on-error: true
        env:
          STEAM_USERNAME: probeuser
        run: |
          STEAM_CONFIG_VDF_B64="$(printf '"InstallConfigStore"\n{\n}\n' | base64 -w0)"
          export STEAM_CONFIG_VDF_B64
          gamecrate steam build --game rimworld --no-load \
            --image localhost/probe-rimworld --beta public --variant linux --json

      - name: What it left in the steam home
        if: always()
        run: |
          find ~/.local/share/gamecrate/steam -maxdepth 4 | sort | head -60

  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record the environment and the exact image
        run: |
          id
          docker --version
          docker pull steamcmd/steamcmd:latest
          docker image inspect steamcmd/steamcmd:latest --format '{{index .RepoDigests 0}}'

      - name: Reach Valve's client cdn from the runner
        continue-on-error: true
        run: |
          for host in media.steampowered.com client-download.steampowered.com steamcdn-a.akamaihd.net; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://$host/client/steamcmd_linux.tar.gz" || echo curl-failed)"
            echo "$host -> $code"
          done

      - name: Cell A, gamecrate's argv today, overridden user and HOME
        continue-on-error: true
        run: |
          H="$RUNNER_TEMP/gc-home"
          mkdir -p "$H/.steam/config"
          printf '"InstallConfigStore" {}\n' > "$H/.steam/config/config.vdf"
          docker run --rm --user "$(id -u):$(id -g)" -v "$H:$H" -e "HOME=$H" \
            steamcmd/steamcmd:latest +quit

      - name: Cell B, root with the image's own prewarmed home
        continue-on-error: true
        run: |
          D="$RUNNER_TEMP/gc-data"
          mkdir -p "$D"
          docker run --rm -v "$D:$D" steamcmd/steamcmd:latest +quit

  pair:
    runs-on: ubuntu-latest
    steps:
      - name: Two sequential runs with the flags gamecrate actually passes
        continue-on-error: true
        run: |
          H="$RUNNER_TEMP/gc-pair"
          mkdir -p "$H/.steam/config"
          printf '"InstallConfigStore" {}\n' > "$H/.steam/config/config.vdf"
          docker pull -q steamcmd/steamcmd:latest
          base=(docker run --rm --user "$(id -u):$(id -g)" -v "$H:$H" -e "HOME=$H"
            steamcmd/steamcmd:latest
            +@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 +login probeuser)
          echo "::group::run 1, the app_info_print shape"
          "${base[@]}" +app_info_update 1 +app_info_print 294100 +quit || echo "run 1 exit=$?"
          echo "::endgroup::"
          echo "::group::run 2, the app_update shape"
          "${base[@]}" +force_install_dir "$H/app" +app_update 294100 +quit || echo "run 2 exit=$?"
          echo "::endgroup::"

  parallel:
    strategy:
      fail-fast: false
      matrix:
        cell: ['1.1', '1.2', '1.3', '1.4', '1.5', '1.6', '1.7']
    runs-on: ubuntu-latest
    steps:
      - name: Cold bootstrap ${{ matrix.cell }}, seven at once like a real build
        run: |
          H="$RUNNER_TEMP/gc-home"
          mkdir -p "$H/.steam/config"
          printf '"InstallConfigStore" {}\n' > "$H/.steam/config/config.vdf"
          docker pull -q steamcmd/steamcmd:latest
          docker run --rm --user "$(id -u):$(id -g)" -v "$H:$H" -e "HOME=$H" \
            steamcmd/steamcmd:latest +quit
