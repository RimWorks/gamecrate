name: sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: RimWorks/mod-ci/.github/workflows/sonar-scan.yml@v1
    with:
      project-key: RimWorks_gamecrate
      exclusions: packages/*/dist/**,packages/cli/test/fixtures/**,Styles/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
