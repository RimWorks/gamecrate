StylesPath = Styles
MinAlertLevel = warning

Packages = Google

Vocab = Gamecrate

[*.md]
BasedOnStyles = Vale, Google, RimWorks

# Headings here are sentence case, which Google agrees with, but the rule fires on
# type names like GamePlugin that have to keep their casing.
Google.Headings = NO

# Reads a dotted identifier such as ludeon.rimworld as two sentences and asks for a
# space between them.
Google.Spacing = NO

# Matches any word ending in "ly" before a hyphen, so it rejects correct compounds
# such as family-of-mods.
Google.LyHyphens = NO

# Fires on a capitalised link title after a colon.
Google.Colons = NO

# Vocabulary terms are flagged when a sentence starts with one, because
# sentence-initial capitals read as inconsistent casing.
Vale.Terms = NO

# AGENTS.md and CLAUDE.md are agent config, not prose a person reads. The Google and
# ASD-STE100 rules exist for published docs.
[{AGENTS,CLAUDE}.md]
BasedOnStyles =
